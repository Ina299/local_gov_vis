name: Check pull request

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run -w @local-gov/crawler test
      - run: npm run -w @local-gov/web test
      - name: Build static export
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /local_gov_vis
